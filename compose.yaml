name: springboot-kafka-demo
services:
  order-db:
    image: postgres:17.6-alpine
    environment: &db-env
      POSTGRES_DB: demo
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
    ports: ["127.0.0.1:5433:5432"]
    volumes: ["order-data:/var/lib/postgresql/data"]
    healthcheck: &db-health
      test: ["CMD-SHELL", "pg_isready -U demo -d demo"]
      interval: 5s
      timeout: 3s
      retries: 30
  inventory-db:
    image: postgres:17.6-alpine
    environment: *db-env
    ports: ["127.0.0.1:5434:5432"]
    volumes: ["inventory-data:/var/lib/postgresql/data"]
    healthcheck: *db-health
  kafka:
    image: apache/kafka:3.9.1
    hostname: kafka
    ports: ["127.0.0.1:9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes: ["kafka-data:/var/lib/kafka/data"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
  order-service:
    build:
      context: .
      args: { SERVICE: order-service }
    environment:
      DB_URL: jdbc:postgresql://order-db:5432/demo
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      order-db: { condition: service_healthy }
      kafka: { condition: service_healthy }
  inventory-service:
    build:
      context: .
      args: { SERVICE: inventory-service }
    environment:
      DB_URL: jdbc:postgresql://inventory-db:5432/demo
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    ports: ["127.0.0.1:8081:8081"]
    depends_on:
      inventory-db: { condition: service_healthy }
      kafka: { condition: service_healthy }
  prometheus:
    image: prom/prometheus:v3.5.0
    volumes: ["./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["127.0.0.1:9090:9090"]
  grafana:
    image: grafana/grafana:12.1.1
    ports: ["127.0.0.1:3000:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: demo-admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
volumes:
  order-data:
  inventory-data:
  kafka-data:
