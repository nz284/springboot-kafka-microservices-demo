name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: mvn -B verify -Pintegration
      - run: docker compose config --quiet
      - run: docker compose up -d --build --remove-orphans
      - run: python3 scripts/smoke.py
      - run: npx --yes newman@6.2.1 run postman/microservices.postman_collection.json --delay-request 1000 --reporters cli,json --reporter-json-export postman-results.json
      - if: always()
        run: docker compose logs --no-color > compose.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification
          path: |
            compose.log
            postman-results.json
            **/target/*-reports/
      - if: always()
        run: docker compose down -v
